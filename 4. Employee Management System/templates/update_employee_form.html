<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Employee - {{ employee.DisplayName }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --accent-color: #e74c3c;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
            --light-bg: #f8f9fa;
            --dark-text: #2c3e50;
            --light-text: #ecf0f1;
            --border-radius: 8px;
            --box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
            color: var(--dark-text);
        }

        .form-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }

        .form-title {
            font-family: 'Montserrat', sans-serif;
            color: var(--secondary-color);
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: center;
            position: relative;
        }

        .form-title:after {
            content: '';
            position: absolute;
            width: 80px;
            height: 4px;
            background: var(--primary-color);
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        .form-section {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px dashed #eee;
        }

        .section-heading {
            color: var(--secondary-color);
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
        }

        .section-heading i {
            margin-right: 0.75rem;
            color: var(--primary-color);
        }

        .form-label {
            font-weight: 500;
            color: var(--secondary-color);
            margin-bottom: 0.5rem;
        }

        .form-control, .form-select {
            border-radius: var(--border-radius);
            border: 1px solid #ced4da;
            padding: 0.75rem 1rem;
            transition: var(--transition);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
        }

        .required-field::after {
            content: " *";
            color: var(--accent-color);
        }

        .photo-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        .photo-preview {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 1rem;
            transition: var(--transition);
        }

        .photo-preview:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .photo-upload-btn {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .photo-upload-btn input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .btn-action {
            padding: 0.75rem 1.5rem;
            border-radius: var(--border-radius);
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-action i {
            margin-right: 0.5rem;
        }

        .btn-update {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        .btn-update:hover {
            background-color: #2980b9;
            border-color: #2980b9;
            transform: translateY(-2px);
        }

        .btn-cancel {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
            color: white;
        }

        .btn-cancel:hover {
            background-color: #1a252f;
            border-color: #1a252f;
            transform: translateY(-2px);
        }

        .status-badge {
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.35em 0.65em;
            border-radius: 50rem;
        }

        .badge-active {
            background-color: rgba(46, 204, 113, 0.2);
            color: var(--success-color);
        }

        .badge-inactive {
            background-color: rgba(231, 76, 60, 0.2);
            color: var(--accent-color);
        }

        .badge-on-leave {
            background-color: rgba(241, 196, 15, 0.2);
            color: var(--warning-color);
        }

        .badge-retired {
            background-color: rgba(149, 165, 166, 0.2);
            color: #7f8c8d;
        }

        .form-note {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 0.5rem;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 1.5rem;
                margin: 1rem;
            }
            
            .photo-preview {
                width: 150px;
                height: 150px;
            }
        }

        /* Animation for form sections */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-section {
            animation: fadeInUp 0.5s ease-out forwards;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1 class="form-title">Update Employee Profile</h1>
        
        <form action="{{ url_for('update_employee', employee_id=employee['EmployeeId']) }}" method="post" enctype="multipart/form-data">
            <!-- Photo Section -->
            <div class="form-section animate-section" style="animation-delay: 0.1s">
                <div class="photo-container">
                    {% if employee.PhotoPath %}
                        <img id="photo-preview" src="{{ url_for('static', filename=employee.PhotoPath) }}" 
                             alt="Profile Photo" class="photo-preview"
                             onerror="this.onerror=null;this.src='{{ url_for('static', filename='images/default-profile.jpg') }}'">
                    {% else %}
                        <img id="photo-preview" src="{{ url_for('static', filename='images/default-profile.jpg') }}" 
                             alt="Profile Photo" class="photo-preview">
                    {% endif %}
                    
                    <div class="d-flex justify-content-center gap-2">
                        <button type="button" class="btn btn-outline-primary photo-upload-btn">
                            <i class="fas fa-camera me-1"></i> Change Photo
                            <input type="file" id="photo" name="photo" accept="image/*" onchange="previewPhoto(this);">
                        </button>
                        {% if employee.PhotoPath %}
                        <button type="button" class="btn btn-outline-danger" onclick="removePhoto()">
                            <i class="fas fa-trash-alt me-1"></i> Remove
                        </button>
                        {% endif %}
                    </div>
                    <p class="form-note">Max file size: 2MB. Allowed formats: JPG, PNG, GIF</p>
                </div>
            </div>

            <!-- Personal Information Section -->
            <div class="form-section animate-section" style="animation-delay: 0.2s">
                <h3 class="section-heading"><i class="fas fa-user-circle"></i> Personal Information</h3>
                
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="employee_id" class="form-label required-field">Employee ID</label>
                        <input type="text" class="form-control" id="employee_id" value="{{ employee['EmployeeId'] }}" readonly>
                        <p class="form-note">Employee ID cannot be changed</p>
                    </div>
                    
                    <div class="col-md-4">
                        <label for="first_name" class="form-label required-field">First Name</label>
                        <input type="text" class="form-control" id="first_name" name="first_name" value="{{ employee['FirstName'] }}" required>
                    </div>
                    
                    <div class="col-md-4">
                        <label for="middle_name" class="form-label">Middle Name</label>
                        <input type="text" class="form-control" id="middle_name" name="middle_name" value="{{ employee['MiddleName'] }}">
                    </div>
                    
                    <div class="col-md-4">
                        <label for="last_name" class="form-label required-field">Last Name</label>
                        <input type="text" class="form-control" id="last_name" name="last_name" value="{{ employee['LastName'] }}" required>
                    </div>
                    
                    <div class="col-md-4">
                        <label for="full_name_arabic" class="form-label">Full Name (Arabic)</label>
                        <input type="text" class="form-control" id="full_name_arabic" name="full_name_arabic" value="{{ employee['FullNameArabic'] }}">
                    </div>
                    
                    <div class="col-md-4">
                        <label for="birthday" class="form-label required-field">Birthday</label>
                        <input type="date" class="form-control" id="birthday" name="birthday" value="{{ employee['Birthday'] }}" required>
                    </div>
                </div>
            </div>

            <!-- Contact Information Section -->
            <div class="form-section animate-section" style="animation-delay: 0.3s">
                <h3 class="section-heading"><i class="fas fa-address-card"></i> Contact Information</h3>
                
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="email_address" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email_address" name="email_address" value="{{ employee['EmailAddress'] }}">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="contact_number" class="form-label required-field">Contact Number</label>
                        <input type="tel" class="form-control" id="contact_number" name="contact_number" value="{{ employee['ContactNumber'] }}" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="nationality" class="form-label required-field">Nationality</label>
                        <input type="text" class="form-control" id="nationality" name="nationality" value="{{ employee['Nationality'] }}" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="nationality_arabic" class="form-label">Nationality (Arabic)</label>
                        <input type="text" class="form-control" id="nationality_arabic" name="nationality_arabic" value="{{ employee['NationalityArabic'] }}">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="passport_number" class="form-label required-field">Passport Number</label>
                        <input type="text" class="form-control" id="passport_number" name="passport_number" value="{{ employee['PassportNumber'] }}" required>
                    </div>
                </div>
            </div>

            <!-- Employment Details Section -->
            <div class="form-section animate-section" style="animation-delay: 0.4s">
                <h3 class="section-heading"><i class="fas fa-briefcase"></i> Employment Details</h3>
                
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="employment_type" class="form-label required-field">Employment Type</label>
                        <select class="form-select" id="employment_type" name="employment_type" required>
                            <option value="Expat" {% if employee['EmploymentType'] == 'Expat' %}selected{% endif %}>Expat</option>
                            <option value="Local" {% if employee['EmploymentType'] == 'Local' %}selected{% endif %}>Local</option>
                            
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="company" class="form-label required-field">Company</label>
                        <input type="text" class="form-control" id="company" name="company" value="{{ employee['Company'] }}" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="company_arabic" class="form-label">Company (Arabic)</label>
                        <input type="text" class="form-control" id="company_arabic" name="company_arabic" value="{{ employee['CompanyArabic'] }}">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="designation" class="form-label required-field">Designation</label>
                        <input type="text" class="form-control" id="designation" name="designation" value="{{ employee['Designation'] }}" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="designation_arabic" class="form-label">Designation (Arabic)</label>
                        <input type="text" class="form-control" id="designation_arabic" name="designation_arabic" value="{{ employee['DesignationArabic'] }}">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="field_of_assignment" class="form-label required-field">Field of Assignment</label>
                        <input type="text" class="form-control" id="field_of_assignment" name="field_of_assignment" value="{{ employee['FieldOfAssignment'] }}" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="field_site" class="form-label required-field">Field Site</label>
                        <input type="text" class="form-control" id="field_site" name="field_site" value="{{ employee['FieldSite'] }}" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="rotation" class="form-label required-field">Rotation</label>
                        <input type="text" class="form-control" id="rotation" name="rotation" value="{{ employee['Rotation'] }}" required>
                    </div>
                </div>
            </div>

            <!-- Contract Details Section -->
            <div class="form-section animate-section" style="animation-delay: 0.5s">
                <h3 class="section-heading"><i class="fas fa-file-contract"></i> Contract Details</h3>
                
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="rate" class="form-label required-field">Rate</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" class="form-control" id="rate" name="rate" value="{{ employee['Rate'] }}" required>
                        </div>
                    </div>
                    
                    <div class="col-md-8">
                        <label for="rate_description" class="form-label required-field">Rate Description</label>
                        <input type="text" class="form-control" id="rate_description" name="rate_description" value="{{ employee['RateDescription'] }}" required>
                    </div>
                    
                    <div class="col-md-4">
                        <label for="arrival_date" class="form-label required-field">Arrival Date</label>
                        <input type="date" class="form-control" id="arrival_date" name="arrival_date" value="{{ employee['ArrivalDate'] }}" required>
                    </div>
                    
                    <div class="col-md-4">
                        <label for="started_date" class="form-label required-field">Started Date</label>
                        <input type="date" class="form-control" id="started_date" name="started_date" value="{{ employee['StartedDate'] }}" required>
                    </div>
                    
                    <div class="col-md-4">
                        <label for="status" class="form-label required-field">Status</label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="Active" {% if employee['Status'] == 'Active' %}selected{% endif %}>Active</option>
                            <option value="Inactive" {% if employee['Status'] == 'Inactive' %}selected{% endif %}>Inactive</option>
                            <option value="On Leave" {% if employee['Status'] == 'On Leave' %}selected{% endif %}>On Leave</option>
                            <option value="On Process" {% if employee['Status'] == 'On Process' %}selected{% endif %}>On Process</option>
                        </select>
                    </div>
                    
                    <div class="col-md-4">
                        <label for="retired" class="form-label required-field">Retired</label>
                        <select class="form-select" id="retired" name="retired" required>
                            <option value="Yes" {% if employee['Retired'] == 'Yes' %}selected{% endif %}>Yes</option>
                            <option value="No" {% if employee['Retired'] == 'No' %}selected{% endif %}>No</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Form Actions -->
            <div class="d-grid gap-3 d-md-flex justify-content-md-end mt-4 animate-section" style="animation-delay: 0.6s">
                <a href="{{ url_for('view_profile', employee_id=employee['EmployeeId']) }}" class="btn btn-cancel me-md-2">
                    <i class="fas fa-times"></i> Cancel
                </a>
                <button type="submit" class="btn btn-update">
                    <i class="fas fa-save"></i> Update Employee
                </button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function previewPhoto(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                
                // Validate file size (max 2MB)
                if (file.size > 2 * 1024 * 1024) {
                    alert('File size exceeds 2MB limit. Please choose a smaller file.');
                    input.value = '';
                    return;
                }
                
                // Validate file type
                const validTypes = ['image/jpeg', 'image/png', 'image/gif'];
                if (!validTypes.includes(file.type)) {
                    alert('Only JPG, PNG, and GIF files are allowed.');
                    input.value = '';
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('photo-preview').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }
        
        function removePhoto() {
            if (confirm('Are you sure you want to remove the current photo?')) {
                document.getElementById('photo-preview').src = '{{ url_for("static", filename="images/default-profile.jpg") }}';
                // Add a hidden field to indicate photo removal
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'remove_photo';
                input.value = '1';
                document.querySelector('form').appendChild(input);
            }
        }
        
        // Auto-generate display name when name fields change
        document.getElementById('first_name').addEventListener('input', updateDisplayName);
        document.getElementById('middle_name').addEventListener('input', updateDisplayName);
        document.getElementById('last_name').addEventListener('input', updateDisplayName);
        
        function updateDisplayName() {
            const firstName = document.getElementById('first_name').value;
            const middleName = document.getElementById('middle_name').value;
            const lastName = document.getElementById('last_name').value;
            
            let displayName = firstName;
            if (middleName) displayName += ` (${middleName})`;
            displayName += ` ${lastName}`;
            
            // Update the display in the form (though it's not submitted)
            document.getElementById('full_name').value = displayName;
        }
        
        // Initialize display name
        updateDisplayName();
    </script>
</body>
</html>
