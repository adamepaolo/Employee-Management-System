{% extends "base.html" %}

{% block title %}Expiry Reports{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0"><i class="fas fa-file-contract me-2"></i>Document Expiry Reports</h3>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('generate_expiry_report') }}">
			 <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="company" class="form-label">Company Filter</label>
                        <select class="form-select" id="company" name="company">
                            <option value="">All Companies</option>
                            {% for company in companies %}
                            <option value="{{ company }}">{{ company }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="days_threshold" class="form-label">
                            Show documents expiring within (days)
                        </label>
                        <input type="number" class="form-control" id="days_threshold" 
                               name="days_threshold" value="30" min="1">
                    </div>
                </div>
                
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-file-pdf me-2"></i>Generate Report
                    </button>
                    <a href="{{ url_for('main_menu') }}" class="btn btn-outline-secondary">
                        <i class="fas fa-times me-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
