<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee List</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 95%;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
        }
        h2 {
            text-align: center;
            color: #007bff;
            margin-bottom: 20px;
        }
        .table-responsive {
            overflow-x: auto;
            margin-bottom: 20px;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 0;
        }
        .table thead th {
            background-color: #f0f0f0;
            color: #343a40;
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid #dee2e6;
        }
        .table tbody tr:nth-child(odd) {
            background-color: #f9f9f9;
        }
        .table tbody tr:hover {
            background-color: #f0f0f0;
        }
        .table tbody td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        .btn-primary, .btn-secondary {
            padding: 8px 16px;
            border-radius: 5px;
            transition: background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, transform 0.1s ease;
            font-size: 0.9rem;
            margin: 2px;
            white-space: nowrap;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
            transform: translateY(-1px);
        }
        .btn-primary:active {
            background-color: #004080;
            border-color: #004080;
            transform: translateY(0);
        }
        .btn-secondary {
            background-color: #e2e3e4;
            border-color: #e2e3e4;
            color: #343a40;
        }
        .btn-secondary:hover {
            background-color: #d1d3d5;
            border-color: #d1d3d5;
            transform: translateY(-1px);
        }
        .btn-secondary:active {
            background-color: #c0c2c5;
            border-color: #c0c2c5;
            transform: translateY(0);
        }
        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            transition: background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, transform 0.1s ease;
            font-size: 0.9rem;
            margin: 2px;
            white-space: nowrap;
        }
        .btn-danger:hover {
            background-color: #c82333;
            border-color: #c82333;
            transform: translateY(-1px);
        }
        .btn-danger:active {
            background-color: #b02a37;
            border-color: #b02a37;
            transform: translateY(0);
        }
        .text-center {
            text-align: center;
        }
        .text-right {
            text-align: right;
        }
        .text-muted {
            font-size: 0.9rem;
            color: #6c757d !important;
        }
        .text-danger {
            color: #dc3545 !important;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .thead-dark th {
            background-color: #343a40;
            color: white;
        }
        .table-striped tbody tr:nth-of-type(odd) {
            background-color: rgba(0, 0, 0, 0.05);
        }
        .table-hover tbody tr:hover {
            background-color: rgba(0, 0, 0, 0.075);
        }
        .page-link {
            border-radius: 5px;
            margin: 0 2px;
        }
        .page-item.active .page-link {
            background-color: #007bff;
            border-color: #007bff;
            color: white;
        }
        .page-link:hover {
            background-color: #e9ecef;
            border-color: #dee2e6;
        }
        .pagination {
            justify-content: center;
            margin-top: 20px;
        }
        .form-control {
            border-radius: 5px;
            border: 1px solid #ced4da;
            padding: 10px;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            font-size: 1rem;
        }
        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
            outline: 0;
        }
        .input-group-append .btn {
            border-radius: 5px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .card-header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        .card-body {
            padding: 20px;
        }
        .card-footer {
            background-color: #f8f9fa;
            padding: 15px;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            text-align: right;
        }
        .alert {
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .alert-success {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        .alert-danger {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        @media (max-width: 768px) {
            .table-responsive {
                overflow-x: auto;
            }
            .table thead {
                display: none;
            }
            .table tbody td {
                display: block;
                width: 100%;
                text-align: left;
                border-bottom: 1px solid #dee2e6;
                padding: 8px;
            }
            .table tbody td:before {
                content: attr(data-label);
                font-weight: bold;
                display: inline-block;
                width: 120px;
                margin-right: 5px;
                color: #343a40;
            }
            .btn-group {
                display: flex;
                flex-wrap: wrap;
            }
            .btn-group .btn {
                margin: 2px;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Employee List</h2>
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Employee Details</h3>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="thead-dark">
                            <tr>
                                <th>Employee ID</th>
                                <th>Full Name</th>
                                <th>Designation</th>
                                <th>Company</th>
                                <th>Field Site</th>
                                <th>Rotation</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td data-label="Employee ID">12345</td>
                                <td data-label="Full Name">John Smith</td>
                                <td data-label="Designation">Software Engineer</td>
                                <td data-label="Company">ABC Corp</td>
                                <td data-label="Field Site">Office Based</td>
                                <td data-label="Rotation">2 weeks</td>
                                <td class="text-right">
                                    <div class="btn-group">
                                        <a href="employee_details.html?id=12345" class="btn btn-primary">View</a>
                                        <button class="btn btn-secondary">Edit</button>
                                        <button class="btn btn-danger">Delete</button>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td data-label="Employee ID">67890</td>
                                <td data-label="Full Name">Jane Doe</td>
                                <td data-label="Designation">Project Manager</td>
                                <td data-label="Company">XYZ Inc</td>
                                <td data-label="Field Site">Field Based</td>
                                <td data-label="Rotation">4 weeks</td>
                                 <td class="text-right">
                                    <div class="btn-group">
                                        <a href="employee_details.html?id=67890" class="btn btn-primary">View</a>
                                        <button class="btn btn-secondary">Edit</button>
                                        <button class="btn btn-danger">Delete</button>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer">
                <nav aria-label="Page navigation example">
                    <ul class="pagination">
                        <li class="page-item"><a class="page-link" href="#">Previous</a></li>
                        <li class="page-item"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item"><a class="page-link" href="#">Next</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function() {
            // Add hover effect to table rows
            $('.table tbody tr').hover(
                function() {
                    $(this).css('background-color', '#f0f0f0');
                },
                function() {
                    $(this).css('background-color', '');
                }
            );
        });
    </script>
</body>
</html>
