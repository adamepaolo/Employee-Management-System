{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <!-- Header with breadcrumb -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0">
                <i class="fas fa-edit text-warning mr-2"></i>
                Edit Flight - {{ flight.company_flight_ref }}
            </h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb bg-transparent p-0">
                    <li class="breadcrumb-item"><a href="{{ url_for('view_flights') }}">All Flights</a></li>
                    <li class="breadcrumb-item"><a href="{{ url_for('view_flight_details', flight_id=flight.id) }}">Flight Details</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Edit Flight</li>
                </ol>
            </nav>
        </div>
        <a href="{{ url_for('view_flight_details', flight_id=flight.id) }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left mr-2"></i> Back to Details
        </a>
    </div>

    <!-- Edit Form -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('edit_flight', flight_id=flight.id) }}" enctype="multipart/form-data" id="editFlightForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <!-- Basic Flight Details -->
                <div class="mb-5">
                    <div class="d-flex align-items-center mb-4">
                        <div class="bg-primary rounded-circle p-2 mr-3">
                            <i class="fas fa-info-circle text-white"></i>
                        </div>
                        <h4 class="mb-0">Basic Flight Details</h4>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="company_flight_ref" class="form-label">
                                <i class="fas fa-hashtag mr-2"></i>Company Flight Reference No
                            </label>
                            <input type="text" class="form-control" id="company_flight_ref" 
                                   name="company_flight_ref" value="{{ flight.company_flight_ref }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="pnr_ticket_number" class="form-label">
                                <i class="fas fa-ticket-alt mr-2"></i>PNR or Ticket Number
                            </label>
                            <input type="text" class="form-control" id="pnr_ticket_number" 
                                   name="pnr_ticket_number" value="{{ flight.pnr_ticket_number }}" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="ticket_status" class="form-label">
                                <i class="fas fa-clipboard-check mr-2"></i>Ticket Status
                            </label>
                            <select class="form-select" id="ticket_status" name="ticket_status" required>
                                <option value="" disabled>Select Status</option>
                                <option value="Issued" {% if flight.ticket_status == 'Issued' %}selected{% endif %}>Issued</option>
                                <option value="On Process" {% if flight.ticket_status == 'On Process' %}selected{% endif %}>On Process</option>
                                <option value="Cancelled" {% if flight.ticket_status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="flight_type" class="form-label">
                                <i class="fas fa-route mr-2"></i>Type of Flight
                            </label>
                            <select class="form-select" id="flight_type" name="flight_type" required>
                                <option value="" disabled>Select Type</option>
                                <option value="Domestic Flight" {% if flight.flight_type == 'Domestic Flight' %}selected{% endif %}>Domestic Flight</option>
                                <option value="International Flight" {% if flight.flight_type == 'International Flight' %}selected{% endif %}>International Flight</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="passenger_id" class="form-label">
                                <i class="fas fa-user mr-2"></i>Passenger Name
                            </label>
                            <select class="form-select" id="passenger_id" name="passenger_id" required>
                                <option value="" disabled>Select Passenger</option>
                                {% for employee in employees %}
                                <option value="{{ employee['EmployeeId'] }}" 
                                        {% if employee['EmployeeId'] == flight.passenger_id %}selected{% endif %}>
                                    {{ employee['DisplayName'] }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="flight_route" class="form-label">
                                <i class="fas fa-map-marked-alt mr-2"></i>Flight Route
                            </label>
                            <input type="text" class="form-control" id="flight_route" 
                                   name="flight_route" value="{{ flight.flight_route }}" required>
                        </div>
                    </div>
                </div>
                
                <!-- Departure Details -->
                <div class="mb-5">
                    <div class="d-flex align-items-center mb-4">
                        <div class="bg-info rounded-circle p-2 mr-3">
                            <i class="fas fa-plane-departure text-white"></i>
                        </div>
                        <h4 class="mb-0">Departure Details</h4>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="departure_country" class="form-label">
                                <i class="fas fa-globe-americas mr-2"></i>Country
                            </label>
                            <input type="text" class="form-control" id="departure_country" 
                                   name="departure_country" value="{{ flight.departure_country or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="departure_airport" class="form-label">
                                <i class="fas fa-plane mr-2"></i>Airport of Departure
                            </label>
                            <input type="text" class="form-control" id="departure_airport" 
                                   name="departure_airport" value="{{ flight.departure_airport or '' }}">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="departure_date" class="form-label">
                                <i class="far fa-calendar-alt mr-2"></i>Departure Date
                            </label>
                            <input type="date" class="form-control" id="departure_date" 
                                   name="departure_date" value="{{ flight.departure_date or '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="departure_time" class="form-label">
                                <i class="far fa-clock mr-2"></i>Departure Time
                            </label>
                            <input type="time" class="form-control" id="departure_time" 
                                   name="departure_time" value="{{ flight.departure_time or '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="departure_airline" class="form-label">
                                <i class="fas fa-plane mr-2"></i>Airlines
                            </label>
                            <input type="text" class="form-control" id="departure_airline" 
                                   name="departure_airline" value="{{ flight.departure_airline or '' }}">
                        </div>
                    </div>
                    
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" id="has_transit" 
                               name="has_transit" {% if flight.has_transit %}checked{% endif %}>
                        <label class="form-check-label" for="has_transit">
                            <i class="fas fa-exchange-alt mr-2"></i>This flight includes transit
                        </label>
                    </div>
                    
                    <div id="transit_details" class="bg-light p-4 rounded" style="display: {% if flight.has_transit %}block{% else %}none{% endif %};">
                        <h5 class="mb-4"><i class="fas fa-layering-horizontal mr-2"></i>Transit Details</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="transit_country" class="form-label">Country</label>
                                <input type="text" class="form-control" id="transit_country" 
                                       name="transit_country" value="{{ flight.transit_country or '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="transit_airport" class="form-label">Transit Airport</label>
                                <input type="text" class="form-control" id="transit_airport" 
                                       name="transit_airport" value="{{ flight.transit_airport or '' }}">
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="transit_hours" class="form-label">Transit Duration</label>
                                <input type="text" class="form-control" id="transit_hours" 
                                       name="transit_hours" value="{{ flight.transit_hours or '' }}" placeholder="e.g. 2h 30m">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="transit_airline" class="form-label">Airlines</label>
                                <input type="text" class="form-control" id="transit_airline" 
                                       name="transit_airline" value="{{ flight.transit_airline or '' }}">
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Arrival Details -->
                <div class="mb-5">
                    <div class="d-flex align-items-center mb-4">
                        <div class="bg-success rounded-circle p-2 mr-3">
                            <i class="fas fa-plane-arrival text-white"></i>
                        </div>
                        <h4 class="mb-0">Arrival Details</h4>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="arrival_country" class="form-label">
                                <i class="fas fa-globe-americas mr-2"></i>Country
                            </label>
                            <input type="text" class="form-control" id="arrival_country" 
                                   name="arrival_country" value="{{ flight.arrival_country }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="arrival_airport" class="form-label">
                                <i class="fas fa-plane-arrival mr-2"></i>Airport of Arrival
                            </label>
                            <input type="text" class="form-control" id="arrival_airport" 
                                   name="arrival_airport" value="{{ flight.arrival_airport }}" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="arrival_date" class="form-label">
                                <i class="far fa-calendar-alt mr-2"></i>Arrival Date
                            </label>
                            <input type="date" class="form-control" id="arrival_date" 
                                   name="arrival_date" value="{{ flight.arrival_date }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="arrival_time" class="form-label">
                                <i class="far fa-clock mr-2"></i>Arrival Time
                            </label>
                            <input type="time" class="form-control" id="arrival_time" 
                                   name="arrival_time" value="{{ flight.arrival_time }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="arrival_airline" class="form-label">
                                <i class="fas fa-plane mr-2"></i>Airlines
                            </label>
                            <input type="text" class="form-control" id="arrival_airline" 
                                   name="arrival_airline" value="{{ flight.arrival_airline }}" required>
                        </div>
                    </div>
                </div>
                
                <!-- Ticket Document -->
                <!--<div class="mb-4">
                    <div class="d-flex align-items-center mb-4">
                        <div class="bg-secondary rounded-circle p-2 mr-3">
                            <i class="fas fa-file-upload text-white"></i>
                        </div>
                        <h4 class="mb-0">Ticket Documentation</h4>
                    </div>
                    
                    <div class="mb-3">
                        <label for="ticket_document" class="form-label">
                            <i class="fas fa-file-pdf mr-2"></i>Upload Ticket Document
                        </label>
                        <input type="file" class="form-control" id="ticket_document" name="ticket_document" accept=".pdf,.jpg,.jpeg,.png">
                        <div class="form-text">
                            Accepted formats: PDF, JPG, PNG (Max 16MB)
                        </div>
                    </div>
                    
                    {% if flight.ticket_document %}
                        <div class="alert alert-light mt-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <i class="fas fa-paperclip mr-2"></i>
                                    <strong>Current file:</strong> 
                                    <a href="{{ url_for('view_ticket', filename=flight.ticket_document.split('/')[-1]) }}" 
                                       target="_blank" class="ml-2">
                                        {{ flight.ticket_document.split('/')[-1] }}
                                    </a>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="delete_ticket_document" name="delete_ticket_document">
                                    <label class="form-check-label text-danger" for="delete_ticket_document">
                                        <i class="fas fa-trash-alt mr-1"></i> Remove current file
                                    </label>
                                </div>
                            </div>
                            
                            {% if flight.ticket_document.endswith(('.jpg', '.jpeg', '.png')) %}
                                <div class="text-center mt-3">
                                    <img src="{{ url_for('view_ticket', filename=flight.ticket_document.split('/')[-1]) }}" 
                                         class="img-thumbnail shadow-sm" style="max-height: 150px;" 
                                         alt="Current Ticket">
                                </div>
                            {% endif %}
                        </div>
                    {% endif %}
                </div>-->
                
                <!-- Form Actions -->
                <div class="d-flex justify-content-between border-top pt-4">
                    <button type="reset" class="btn btn-outline-secondary">
                        <i class="fas fa-undo mr-2"></i>Reset Form
                    </button>
                    <div>
                        <a href="{{ url_for('view_flight_details', flight_id=flight.id) }}" class="btn btn-outline-danger me-2">
                            <i class="fas fa-times mr-2"></i>Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save mr-2"></i>Update Flight
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Show/hide transit details with smooth animation
    document.getElementById('has_transit').addEventListener('change', function() {
        const transitDetails = document.getElementById('transit_details');
        if (this.checked) {
            transitDetails.style.display = 'block';
            setTimeout(() => {
                transitDetails.style.opacity = '1';
            }, 10);
        } else {
            transitDetails.style.opacity = '0';
            setTimeout(() => {
                transitDetails.style.display = 'none';
            }, 300);
        }
        
        // Make transit fields required if checked
        const transitFields = transitDetails.querySelectorAll('input');
        transitFields.forEach(field => {
            field.required = this.checked;
        });
    });
    
    // Date validation to ensure arrival is after departure
    document.getElementById('editFlightForm').addEventListener('submit', function(e) {
        const departureDate = document.getElementById('departure_date').value;
        const arrivalDate = document.getElementById('arrival_date').value;
        
        if (departureDate && arrivalDate && new Date(arrivalDate) < new Date(departureDate)) {
            e.preventDefault();
            alert('Error: Arrival date must be after departure date');
            document.getElementById('arrival_date').focus();
        }
    });
    
    // Initialize date fields with today's date as default
    document.addEventListener('DOMContentLoaded', function() {
        const today = new Date().toISOString().split('T')[0];
        const departureDateEl = document.getElementById('departure_date');
        const arrivalDateEl = document.getElementById('arrival_date');
        
        if (!departureDateEl.value) departureDateEl.min = today;
        if (!arrivalDateEl.value) arrivalDateEl.min = today;
        
        // Set arrival date min based on departure date
        departureDateEl.addEventListener('change', function() {
            arrivalDateEl.min = this.value;
        });
    });
</script>

<style>
    .form-label {
        font-weight: 500;
    }
    #transit_details {
        transition: opacity 0.3s ease;
        opacity: 1;
    }
    .card {
        border-radius: 10px;
    }
    .form-control, .form-select, .form-check-input {
        border-radius: 5px;
    }
    dt.text-muted {
        font-weight: normal;
    }
    dd {
        margin-bottom: 0.5rem;
    }
</style>
{% endblock %}
